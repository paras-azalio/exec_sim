            #    sftp:
            #      operation: download
            #      local_path: "${LOCAL_PATH}/Signaling_${DATE}_Rollback.xml"
            #      remote_path: "${BACK_UP_LOCATION_REPO}/Signaling_${DATE}_Rollback.xml"
            #      overwrite: true
            #      create_dirs: true
             - node: locals
               command_description: "Attempt ${ATTEMPT} - re-verify checksum"
               send: "sha256sum ${LOCAL_PATH}/Signaling_${DATE}_Rollback.xml | awk '{print $1}'"
               on_failure: continue
               timeout_sec: 120
               register:
                 - regex: '(?<LOCALCHECKSUM>[a-fA-F0-9]+)'
               validation:
                 enabled: true
                 description: "Compare checksum on retry attempt ${ATTEMPT}"
                 success:
                   criteria:
                     expr: '${REPOCHECKSUM == LOCALCHECKSUM}'
                   message: "CheckSum is same."
                   vars:
                     CHECKSUM_STATUS: "SUCCESS"
                 warning:
                   message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
                   vars:
                     CHECKSUM_STATUS: "FAILED"
                     
         - node: locals
           command_description: "Abort if checksum still mismatched after ${RETRY_COUNT} retries"
           send: "echo checksum-guard"
           when: '${CHECKSUM_STATUS != "SUCCESS"}'
           hide_when_skipped: true
           on_failure: stop
           validation:
             enabled: true
             description: "Runs only when checksum did not match after all retries; always fails to abort."
             success:
               criteria:
                 expr: '${CHECKSUM_STATUS == "SUCCESS"}'
               message: "checksum matched"
             failure:
               message: "Checksum did not match after all retry attempts - aborting."