  activity_configuration:
    name: "ACTIVITY_CONFIGURATION"
    description: >
      Generate NETCONF XML change-sets from CIQ JSON, then for each table:
      download current config, merge changes, transfer merged XML to SBC,
      and execute via netconfprov.
    when: '${ROLLBACK_ONLY != "true"}'
    steps: 

    
      - type: loop
        for_each: "${configSequences}"
        item_var: config_seq_row
        max_iterations: 50
        var_meta:
          configSequences: "List of config sequences from ciq-processor JSON for current node"
        steps:
          - type: loop
            for_each: "${config_seq_row.tables}"
            item_var: table_row
            max_iterations: 50
            steps:
              - node: locals
                command_description: "validate and generate network configuration xml from CIQ data according to table"
                send: >-
                 python ${ACTIVITY_PYTHON_SCRIPT_PATH}/netconf_generate_xml.py --json "${INPUT_JSON_FILE_NAME}" --node ${NODE_NAME} --xmlns "${xmlns}" --primary-keys "${primary_keys}" --base "${LOCAL_PATH}/Signaling_${NODE_NAME}_${DATE}.xml" --output ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Activity.xml --table ${table_row.table} --group ${config_seq_row.configSeq}
                on_failure: stop
                register:
                  - regex: '(?<XMLGENSTATUS>SUCCESS)'
                validation:
                  enabled: true
                  description: "XML generation script completes successfully and output file ${table_row.table}_${DATE}.xml is created without validation errors."
                  success:
                    criteria:
                      expr: '${XMLGENSTATUS == "SUCCESS"}'
                    message: "Network configuration XML generated successfully from CIQ data."
                  failure:
                    message: "Network configuration XML not generated successfully from CIQ data."

          - type: loop
            for_each: "${config_seq_row.tables}"
            item_var: table_row
            max_iterations: 50
            steps:

              - node: niam_sbc_server
                command_description: "Take full table configuration xml for ${table_row.table} before execution"
                send: '/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane signaling --user ${USER} --pemfile /root/.ssh/id_rsa --table ${table_row.table} --read > /storage/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Precheck.xml'
                on_failure: stop
                use_exit_code: true
                register:
                  - regex: '(?<ERRORMSG>cannot create \[No such file or directory\])'
                  - regex: '(?<ROOTNOTALLOWED>root user is not allowed)'
                validation:
                  enabled: true
                  description: "Verify ${table_row.table} completes successfully and XML file is created."
                  success:
                    criteria:
                      expr: '${ERRORMSG == "" && ROOTNOTALLOWED == ""}'
                    message: "${table_row.table}.xml is created successfully."
                  failure:
                    message: "Failed to apply NETCONF configuration changes with netconfcli."
                    vars:
                      ROLLBACK_REQUIRED: 'true' 

              - node: niam_sbc_server
                command_description: "Read configuration xml content for ${table_row.table} for prevalidation"
                send: "cat /storage/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Precheck.xml; echo"
                use_exit_code: true
                on_failure: stop
                register:
                  - regex: '(?s)(?<SIGNALINGXML><config[\s\S]*?</config>)'
                validation:
                  enabled: true
                  description: "capture configuration xml content for ${table_row.table}"
                  success:
                    criteria:
                      expr: '${SIGNALINGXML != ""}'
                    message: "capture configuration xml content successfully"
                  failure:
                    message: "Failed to capture configuration xml content"
                    vars:
                      ROLLBACK_REQUIRED: "true"

              - node: locals
                command_description: "creating network configuration xml for ${table_row.table} on locals"
                send: echo '${base64:SIGNALINGXML}' | base64 -d > ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Precheck.xml && echo WRITE_OK
                on_failure: stop
                timeout_sec: 1200
                validation:
                  enabled: true
                  description: "creating network configuration xml for ${table_row.table} on locals."
                  success:
                    criteria:
                      regex: 'WRITE_OK'
                    message: "table network configuration xml created for ${table_row.table}"
                  failure:
                    message: "Fail to write table network configuration xml created for ${table_row.table}"
                    vars:
                      ROLLBACK_REQUIRED: 'true'                      
            
              - node: locals
                command_description: "validate network configuration XML generation to ensure data integrity and prevent the creation of invalid or inconsistent XML."
                send: 'xmllint --noout ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Activity.xml && echo xml_valid'
                on_failure: stop
                validation:
                  enabled: true
                  description: "verify network configuration XML generation to ensure data integrity and prevent the creation of invalid or inconsistent XML."
                  success:
                    criteria:
                      regex: 'xml_valid'
                    message: "data is consistent"
                  failure:
                    message: "data is not consistent"
                    vars:
                      ROLLBACK_REQUIRED: 'true'
                

              - node: locals
                command_description: "Read generate network configuration xml from CIQ data for ${table_row.table} "
                send: "cat ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Activity.xml; echo"
                on_failure: stop
                register:
                  - regex: '(?s)(?<SIGNALINGXML><config[\s\S]*?</config>)'
                validation:
                  enabled: true
                  description: "generate network configuration xml content captured from locals."
                  success:
                    criteria:
                      expr: '${SIGNALINGXML != ""}'
                    message: "content captured from node."
                  failure:
                    message: "Failed to captured the content from locals."
                    vars:
                      ROLLBACK_REQUIRED: "true"

              - node: niam_sbc_server
                command_description: "creating network configuration xml for ${table_row.table} on node"
                send: echo '${base64:SIGNALINGXML}' | base64 -d > /storage/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Activity.xml && echo WRITE_OK
                use_exit_code: true
                timeout_sec: 1200
                on_failure: stop
                validation:
                  enabled: true
                  description: "creating network configuration xml for ${table_row.table} on node"
                  success:
                    criteria:
                      regex: 'WRITE_OK'
                    message: "table network configuration xml created for ${table_row.table}"
                  failure:
                    message: "Failed to write table network configuration xml for ${table_row.table}"
                    vars:
                      ROLLBACK_REQUIRED: "true"
                      
              - node: niam_sbc_server
                command_description: "validate network configuration XML generation to ensure data integrity and prevent the creation of invalid or inconsistent XML."
                send: 'xmllint --noout /storage/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Activity.xml && echo xml_valid'
                on_failure: stop
                use_exit_code: true
                validation:
                  enabled: true
                  description: "verify network configuration XML generation to ensure data integrity and prevent the creation of invalid or inconsistent XML."
                  success:
                    criteria:
                      regex: 'xml_valid'
                    message: "data is consistent"
                  failure:
                    message: "data is not consistent"
                    vars:
                      ROLLBACK_REQUIRED: 'true'

              - node: niam_sbc_server
                command_description: "Apply New NETCONF XML Changes on SBC Node of ${table_row.table} (root)"
                send: "/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane signaling --user ${USER} --pemfile /root/.ssh/id_rsa --onerror abort /storage/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Activity.xml"
                on_failure: stop
                use_exit_code: true
                register:
                  - regex: '(?<NETCONFABORTED>provision is aborted.*)'
                  - regex: '(?<ROOTNOTALLOWED>root user is not allowed)'
                validation:
                  enabled: true
