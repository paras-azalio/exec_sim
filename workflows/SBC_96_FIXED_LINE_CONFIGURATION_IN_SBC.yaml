              - regex: '(?m)^(?<BACKUPNODECHECKSUM>[a-fA-F0-9]{64})$'     
          
          - node: repo_server
            command_description: "Creating a Directory for Backup Files"
            send: "mkdir -p ${BACK_UP_LOCATION_REPO}"
            prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
            on_failure: stop
            
          - node: niam_sbc_server
            command_description: "SFTP upload backup from SBC Node to Repository Server"
            send: >-
               printf "put /storage/Signaling_${NODE_NAME}_${DATE}.xml ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml\nbye\n" | sftp -o StrictHostKeyChecking=no admin@${repo_server_ip}
            on_failure: stop
            expect_reply:
              - expect: 'password:'
                reply: 'admin'
            use_exit_code: true
            retries: 5
            retry_delay_sec: 15
            retry_on:
              - non_zero_exit
              - regex_miss
              - timeout
            register:
                - regex: '(?<FILECOPY>100%)'
            validation:
              enabled: true
              description: "Backup XML file is transferred successfully from SBC Node to Repository Server."
              success:
                criteria:
                  expr: '${FILECOPY != ""}'
                message: "Successfully uploaded backup file to the repository server."
              warning:
                  message: "Failed to upload backup file to the repository server."
                  vars:
                   XML_BACKUP: "false"
                   NETCONF_ROOT_OK: "false"
                   ROLLBACK_REQUIRED: 'true'
                
                
          - node: repo_server
            command_description: "Finding and Comparing Checksum for Uploaded File"
            send: "sha256sum ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
            prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$' 
            on_failure: continue
            timeout_sec: 120
            on_failure_message: "If all retries are exhausted then execution will be stopped."
            register:
              - regex: '(?<BACKUPREPOCHECKSUM>[a-fA-F0-9]+)'
            validation:
              enabled: true
              description: "Checksum of the repository file matches the checksum of the original backup file."
              success:
                criteria:
                  expr: '${BACKUPNODECHECKSUM == BACKUPREPOCHECKSUM}'
                message: "Backup file integrity verified. Checksums match."
                vars:
                  CHECKSUM_STATUS: "SUCCESS"
              warning:
                message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times. If it will fail AutoRollback will trigger"
                vars:
                  CHECKSUM_STATUS: "FAILED"
                  
          - type: loop
            command_description: "Retry transfer + checksum up to ${RETRY_COUNT} times until checksum matches"
            for_each: "${LOOP_RETRY}"
            item_var: ATTEMPT
            when: '${CHECKSUM_STATUS != "SUCCESS"}'
            break_when: '${CHECKSUM_STATUS == "SUCCESS"}'
            hide_when_skipped: true
            steps:
              - node: niam_sbc_server
                command_description: "Attempt ${ATTEMPT} - re-upload signaling backup to repo"
                send: >-
                  printf "put /storage/Signaling_${NODE_NAME}_${DATE}.xml ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml\nbye\n" | sftp -o StrictHostKeyChecking=no admin@${repo_server_ip}
                on_failure: continue
                expect_reply:
                  - expect: 'password:'
                    reply: 'admin' 
                use_exit_code: true
                retries: 5
                retry_delay_sec: 15
                retry_on:
                  - non_zero_exit
                  - regex_miss
                  - timeout
                register:
                    - regex: '(?<FILECOPY>100%)'
                validation:
                  enabled: true
                  description: "Backup XML file is transferred successfully from SBC Node to Repository Server."
                  success:
                    criteria:
                      expr: '${FILECOPY != ""}'
                    message: "Successfully uploaded backup file to the repository server."
                  warning:
                      message: "Failed to upload backup file to the repository server."
              - node: repo_server
                command_description: "Attempt ${ATTEMPT} - re-verify checksum"
                send: "sha256sum ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
                prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
                on_failure: continue
                timeout_sec: 30
                register:
                  - regex: '(?<BACKUPREPOCHECKSUM>[a-fA-F0-9]+)'
                validation:
                  enabled: true
                  description: "Compare checksum on retry attempt ${ATTEMPT}"
                  success:
                    criteria:
                      expr: '${BACKUPNODECHECKSUM == BACKUPREPOCHECKSUM}'
                    message: "CheckSum is same."
                    vars:
                      CHECKSUM_STATUS: "SUCCESS"
                  warning:
                    message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
                    vars:
                      CHECKSUM_STATUS: "FAILED"
          
