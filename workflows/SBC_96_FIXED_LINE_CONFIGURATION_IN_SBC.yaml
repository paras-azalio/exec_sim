                    criteria:
                      expr: '${NETCONFABORTED == "" && ROOTNOTALLOWED == ""}'
                    message: "NETCONF changes applied successfully without errors."
                    vars:
                      EXECUTED_TABLES: "${EXECUTED_TABLES}${table_row.table}, "
