                      expr: '${ERRORMSG == "" && ROOTNOTALLOWED == ""}'
                    message: "${table_row.table}.xml is created successfully."
                  failure:
                    message: "Failed to apply NETCONF configuration changes with netconfcli."
                    vars:
                      ROLLBACK_REQUIRED: 'true' 

              - node: niam_sbc_server
                command_description: "Read configuration xml content for ${table_row.table} for prevalidation"
                send: "cat /storage/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Rollback_Precheck.xml; echo"
                use_exit_code: true
                on_failure: stop
                register:
                  - regex: '(?s)(?<SIGNALINGXML><config[\s\S]*?</config>)'
                validation:
                  enabled: true
                  description: "capture configuration xml content for ${table_row.table}"
                  success:
                    criteria:
                      expr: '${SIGNALINGXML != ""}'
                    message: "capture configuration xml content successfully"
                  failure:
                    message: "Failed to capture configuration xml content"
                    vars:
                      ROLLBACK_REQUIRED: "true"

              - node: locals
                command_description: "creating network configuration xml for ${table_row.table} on locals"
                send: echo '${base64:SIGNALINGXML}' | base64 -d > ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Rollback_Precheck.xml && echo WRITE_OK
                on_failure: stop
                timeout_sec: 1200
                validation:
                  enabled: true
                  description: "creating network configuration xml for ${table_row.table} on locals."
                  success:
                    criteria:
                      regex: 'WRITE_OK'
                    message: "table network configuration xml created for ${table_row.table}"
                  failure:
                    message: "Fail to write table network configuration xml created for ${table_row.table}"
                    vars:
                      ROLLBACK_REQUIRED: 'true'                       
                     
              - node: locals
                command_description: "validate network configuration XML generation to ensure data integrity and prevent the creation of invalid or inconsistent XML."
                send: 'xmllint --noout ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Rollback.xml && echo xml_valid'
                on_failure: stop
                validation:
                  enabled: true
                  description: "verify network configuration XML generation to ensure data integrity and prevent the creation of invalid or inconsistent XML."
                  success:
                    criteria:
                      regex: 'xml_valid'
                    message: "data is consistent"
                  failure:
                    message: "data is not consistent"

              - node: locals
                command_description: "Read generate rollback network configuration xml from CIQ data for ${table_row.table}"
                when: '${TABLE_ROLLBACK_APPLICABLE == "true"}'
                send: "cat ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Rollback.xml; echo"
                on_failure: stop
                register:
                  - regex: '(?s)(?<SIGNALINGXML><config[\s\S]*?</config>)'
                validation:
