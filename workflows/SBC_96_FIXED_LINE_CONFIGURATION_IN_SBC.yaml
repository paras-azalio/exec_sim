version: 1.2
name: sbc-fixed-line-configuration-automation

globals:
  vars:

    # -- SBC NETCONF XML attributes --------------------------------------------
    ne:           "ne-xxx"
    ne_version:   "R24.7"
    ne_type:      "SBC-signaling"
    soi_version:  "1.0"
    xmlns:        "http://nokia.com/yang/isbc-sig"
    
    # -- XML primary key columns (identify a Record within a table) -------------
    primary_keys: "ID"

    # -- Script location (on MANO / OM server) --------------------------------
    scripts_dir:  "src/main/resources/script/python"

    # -- Working directory on MANO for generated / merged XML files ------------
    work_dir:     "/tmp/${ORDER_NO}/${NODE_NAME}"

    # -- Execution control -----------------------------------------------------
    order_number:      "${ORDER_NO}"
    ROLLBACK_REQUIRED: "false"
    
    BACK_UP_LOCATION_REPO: "/repo-server/config/CR_AUTOMATION/SBC_FIXED_INSTALLATION/${CHILD_REQ_ID}/${NODE_NAME}"
    LOCAL_PATH: "/mnt/shared_data/${CHILD_REQ_ID}/${NODE_NAME}/XML"
    
    
    EXECUTED_TABLES: ""
    ROLLBACK_EXECUTED_TABLES: ""

    # -- Checksum retry control (DPA-style) ------------------------------------
    LOOP_RETRY: [1, 2]        # attempt count = list length
    RETRY_COUNT: 2
    
    ACTIVITY_PYTHON_SCRIPT_PATH: '/data/cloud-user/om/install/sas/bin/macro_server/java/CLICR/ANY/V1/script/python'
    ROLLBACK_PYTHON_SCRIPT_PATH: '/data/cloud-user/om/install/sas/bin/macro_server/java/CLICR/ANY/V1/script/python'
    
    USER: 'root'

    SBC_OM_INTERFACE: 'oam.1151'
    REPO_IP_V4: '127.0.0.1'
    REPO_IP_V6: '2401:4900:24:439::3'    

  defaults:
    timeout_sec:             300
    interaction_timeout_sec: 60
    log_level:               detailed
    on_failure:              stop

# -- Node connections ----------------------------------------------------------
nodes:
  niam_sbc_server:
    type:   remote
    plugin: ssh
    prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
    category: internal
    ssh:
      host: "127.0.0.1"
      port: "2222"
      user: "admin"
      auth:
        password: "admin"
      ne_id: "${niamID}"
      connect_timeout_sec: 300
      read_timeout_sec: 180
      keepalive_sec: 30
      strict_host_key_checking: false

  locals:
    type:   remote
    plugin: ssh
    prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
    category: internal
    ssh:
      host: "127.0.0.1"
      port: "2222"
      user: "admin"
      auth:
        password: "admin"
      ne_id: "${niamID}"
      connect_timeout_sec: 300
      read_timeout_sec: 180
      keepalive_sec: 30
      strict_host_key_checking: false
 
      
      
  

  repo_server:
    type: remote
    plugin: ssh
    prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
    ssh:
      host: "127.0.0.1"
      port: 2222
      user: "admin"
      auth:
        password: "admin"
      connect_timeout_sec: 15
      read_timeout_sec: 120
      keepalive_sec: 30
      strict_host_key_checking: false
      
  repo_server_sftp:
    type: sftp
    plugin: sftp-plugin
    sftp:
      host: "127.0.0.1"
      user: "admin"
      auth:
        password: "admin"
      strict_host_key_checking: false
      connect_timeout_sec: 15 
 
  

