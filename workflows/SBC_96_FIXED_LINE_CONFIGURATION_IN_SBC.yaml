            warning:
              message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
              vars:
                MGW01CHECKSUMSTATUS: "FAILED"

    - node: locals
      command_description: "Abort if media-plane 1 checksum still mismatched after ${RETRY_COUNT} retries"
      send: "echo checksum-guard"
      when: '${MGW01CHECKSUMSTATUS != "SUCCESS"}'
