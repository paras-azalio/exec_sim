      #     failure:
      #       message: "Completion message missing, CRITI value greater than 0."
                    
      - node: niam_sbc_server
        command_description: "Verifies the health of the alarm subsystem."
        send: 'alarm_check --action health'
        on_failure: continue
        prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
        register:
          - regex: '(?<ALARMHEALTHSTATUS>Alarm health check passed)'
        validation:
          enabled: true
          description: >
            Verify output contains "Alarm health check passed".
          success:
            criteria:
              expr: '${ALARMHEALTHSTATUS != ""}'
            message: "Alarm health check passes successfully."
          failure:
            message: "Alarm Health Check Failed."

      - node: niam_sbc_server
        command_description: "Displays current alarms on the SBC node."
        send: 'alarm_cli --list all'
        on_failure: continue
        prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
        register:
          - regex: '(?<INFORMATIONALEXPECTE>.*)'
        validation:
          enabled: false
          description: "Informational command used to review current alarms."
          failure:
              message: "No Validation"
              
      - node: niam_sbc_server
        command_description: "Displays LCP host and service member status."
        send: 'lcp_status'
        prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
        on_failure: continue
        register:
         - name: INVALIDHOST
           value: ""
         - name: INVALIDSERVICE
           value: ""
         - regex: '(?ms)Host info:.*?(?<INVALIDHOST>\b(DISABLED|FAILED|LOCKED|OUTOFSERVICE|UNKNOWN)\b).*?Service Members Info'
         - regex: '(?ms)Service Members Info:.*?(?<INVALIDSERVICE>\b(DISABLED|FAILED|LOCKED|OUTOFSERVICE|UNKNOWN)\b)'
        validation:
          enabled: true
          description: >
            Verify:
              - Every Host Info Status = ENABLED
              - Service Member status values are valid (ENABLED, ENABLEDUNLOCKED, HOTSTANDBY, NOTRELEVANT).
          success:
            criteria:
               expr: '${INVALIDHOST == "" && INVALIDSERVICE == ""}'
            message: "All hosts are enabled and service members show valid operational states." 
          failure:
            message: "One or more hosts are not ENABLED, or service members show invalid/unexpected states."

      - node: niam_sbc_server
        command_description: "Displays REM service and redundancy status."
        send: 'rem_srv_state --action display --set all'
        prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
        on_failure: stop
        on_failure_message: "One or more services are out of service, in an invalid state, or REM controller roles are incorrect/missing. Execution will stop"
        register:
          - name: INVALIDCARDSTATE
            value: ""
          - name: INVALIDREMCSTATE
            value: ""
          - regex: '(?m)(?<INVALIDCARDSTATE>^\d+\s+\d+\s+\d+\s+\S+\s+\S+\s+\S+\s+(?!InserviceActive\b|InserviceStbyHot\b)\S+)'
          - regex: '(?<INVALIDREMCSTATE>REMc is (?!Active\b|Stby\b)\S+)'
        validation:
          enabled: true
          description: >
            Verify:
              - Status is either InserviceActive or InserviceStbyHot for all entries.
              - REM Controller (REMc) role is Active or Stby.
          success:
            criteria:
               expr: '${INVALIDCARDSTATE == "" && INVALIDREMCSTATE == ""}'
            message: "All services are in valid in-service states and REM controllers have valid redundancy roles."
          failure:
            message: "One or more services are out of service, in an invalid state, or REM controller roles are incorrect/missing."
            
            


    # -- 2. Backup ---------------------------------------------------------------

  backup:
    name:        "BACKUP"
    description: "Full NETCONF backup of SBC signaling and media plane configurations"
    when: '${ROLLBACK_ONLY != "true"}'
    steps:
    
    - node: niam_sbc_server
      command_description: "Get LCP management IP address and type"
      send: |-
        lcp_status | awk '$1=="MI" && $4=="ENABLED"{n=split($6,a,","); for(i=1;i<=n;i++) if(a[i]~/^[0-9]+\./ && a[i]!~/^169\.254\./){print a[i]" (IPv4)"; found=1; exit} for(i=1;i<=n;i++) if(a[i]~/:/){print a[i]" (IPv6)"; found=1; exit}} END{exit !found}'
      use_exit_code: true
      on_failure: stop
      register:
        - regex: '(?<LCPIP>[^\s]+)\s+\((?<LCPIPTYPE>IPv4|IPv6)\)'
        - name: repo_server_ip
          when: ${LCPIPTYPE == "IPv4"}
          value: ${REPO_IP_V4}
        - name: repo_server_ip
          when: ${LCPIPTYPE == "IPv6"}
          value: "[${REPO_IP_V6}]"
          
    - node: niam_sbc_server
      command_description: "date"
      send: 'date +%Y-%m-%d_%H-%M-%S'
      on_failure: stop
      prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
      register:
        - regex: '(?<DATE>\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2})'

    - node: niam_sbc_server
      command_description: "Take full signaling-plane Configuration backup (root)"
      send: '/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane signaling --user ${USER} --pemfile /root/.ssh/id_rsa --readall > /storage/Signaling_${NODE_NAME}_${DATE}.xml'
      on_failure: continue
      use_exit_code: true
      register:
          - regex: '(?<ERRORMSG>cannot create \[No such file or directory\])'
          - regex: '(?<ROOTNOTALLOWED>root user is not allowed)'
      validation:
        enabled: true
        description: "Verify Configuration backup completes successfully and  backup XML file is created."
        success:
          criteria:
            expr: '${ERRORMSG == "" && ROOTNOTALLOWED == ""}'
          message: "Signaling-plane Configuration backup created successfully."
          vars:
           XML_BACKUP: "true"
           NETCONF_ROOT_OK: "true"
        warning:
          message: "root could not run netconfprov (or command failed); retrying with netconfcli user."
          vars:
           XML_BACKUP: "false"
           NETCONF_ROOT_OK: "false"
           USER: 'netconfcli'

    - node: niam_sbc_server
      command_description: "Take full signaling-plane Configuration backup (netconfcli fallback)"
      when: '${NETCONF_ROOT_OK == "false"}'
      var_meta:
        NETCONF_ROOT_OK: "NETCONF command ran with root user"
      send: '/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane signaling --user netconfcli --pemfile /var/webui/.ssh/id_rsa --readall > /storage/Signaling_${NODE_NAME}_${DATE}.xml'
      on_failure: stop
      use_exit_code: true
      register:
          - regex: '(?<ERRORMSG>cannot create \[No such file or directory\])'
      validation:
        enabled: true
        description: "Verify Configuration backup (netconfcli) completes successfully and backup XML file is created."
        success:
          criteria:
            expr: '${ERRORMSG == ""}'
          message: "Signaling-plane Configuration backup created successfully via netconfcli."
          vars:
           XML_BACKUP: "true"
        failure:
          message: "Failed to create signaling-plane Configuration backup with netconfcli."
          vars:
           XML_BACKUP: "false"
          
    - node: niam_sbc_server
      command_description: "Finding Checksum for the backup file"
      when: '${XML_BACKUP == "true"}'
      send: "sha256sum /storage/Signaling_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
      prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$' 
      on_failure: stop
      register:
        - regex: '(?m)^(?<BACKUPNODECHECKSUM>[a-fA-F0-9]{64})$'     
    
    - node: repo_server
      command_description: "Creating a Directory for Backup Files"
      send: "mkdir -p ${BACK_UP_LOCATION_REPO}"
      prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
      on_failure: stop
      
    - node: niam_sbc_server
      command_description: "SFTP upload backup from SBC Node to Repository Server"
      send: >-
         printf "put /storage/Signaling_${NODE_NAME}_${DATE}.xml ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml\nbye\n" | sftp -o StrictHostKeyChecking=no admin@${repo_server_ip}
      on_failure: stop
      expect_reply:
        - expect: 'password:'
          reply: 'admin'
      use_exit_code: true
      retries: 5
      retry_delay_sec: 15
      retry_on:
        - non_zero_exit
        - regex_miss
        - timeout
      register:
          - regex: '(?<FILECOPY>100%)'
      validation:
        enabled: true
        description: "Backup XML file is transferred successfully from SBC Node to Repository Server."
        success:
          criteria:
            expr: '${FILECOPY != ""}'
          message: "Successfully uploaded backup file to the repository server."
        warning:
            message: "Failed to upload backup file to the repository server."
          
          
    - node: repo_server
      command_description: "Finding and Comparing Checksum for Uploaded File"
      send: "sha256sum ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
      prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$' 
      on_failure: continue
      timeout_sec: 120
      on_failure_message: "If all retries are exhausted then execution will be stopped."
      register:
        - regex: '(?<BACKUPREPOCHECKSUM>[a-fA-F0-9]+)'
      validation:
        enabled: true
        description: "Checksum of the repository file matches the checksum of the original backup file."
        success:
          criteria:
            expr: '${BACKUPNODECHECKSUM == BACKUPREPOCHECKSUM}'
          message: "Backup file integrity verified. Checksums match."
          vars:
            CHECKSUM_STATUS: "SUCCESS"
        warning:
          message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
          vars:
            CHECKSUM_STATUS: "FAILED"
    - type: loop
      command_description: "Retry transfer + checksum up to ${RETRY_COUNT} times until checksum matches"
      for_each: "${LOOP_RETRY}"
      item_var: ATTEMPT
      when: '${CHECKSUM_STATUS != "SUCCESS"}'
      break_when: '${CHECKSUM_STATUS == "SUCCESS"}'
      hide_when_skipped: true
      steps:
        - node: niam_sbc_server
          command_description: "Attempt ${ATTEMPT} - re-upload signaling backup to repo"
          send: >-
            printf "put /storage/Signaling_${NODE_NAME}_${DATE}.xml ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml\nbye\n" | sftp -o StrictHostKeyChecking=no admin@${repo_server_ip}
          on_failure: continue
          expect_reply:
            - expect: 'password:'
              reply: 'admin' 
          use_exit_code: true
          retries: 5
          retry_delay_sec: 15
          retry_on:
            - non_zero_exit
            - regex_miss
            - timeout
          register:
              - regex: '(?<FILECOPY>100%)'
          validation:
            enabled: true
            description: "Backup XML file is transferred successfully from SBC Node to Repository Server."
            success:
              criteria:
                expr: '${FILECOPY != ""}'
              message: "Successfully uploaded backup file to the repository server."
            warning:
                message: "Failed to upload backup file to the repository server."
        - node: repo_server
          command_description: "Attempt ${ATTEMPT} - re-verify checksum"
          send: "sha256sum ${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
          prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
          on_failure: continue
          timeout_sec: 30
          register:
            - regex: '(?<BACKUPREPOCHECKSUM>[a-fA-F0-9]+)'
          validation:
            enabled: true
            description: "Compare checksum on retry attempt ${ATTEMPT}"
            success:
              criteria:
                expr: '${BACKUPNODECHECKSUM == BACKUPREPOCHECKSUM}'
              message: "CheckSum is same."
              vars:
                CHECKSUM_STATUS: "SUCCESS"
            warning:
              message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
              vars:
                CHECKSUM_STATUS: "FAILED"

    - node: locals
      command_description: "Abort if checksum still mismatched after ${RETRY_COUNT} retries"
      send: "echo checksum-guard"
      when: '${CHECKSUM_STATUS != "SUCCESS"}'
      hide_when_skipped: true
      on_failure: stop
      validation:
        enabled: true
        description: "Runs only when checksum did not match after all retries; always fails to abort."
        success:
          criteria:
            expr: '${CHECKSUM_STATUS == "SUCCESS"}'
          message: "checksum matched"
        failure:
          message: "Checksum did not match after all retry attempts - aborting."

    # - node: repo_server_sftp
    #   sftp:
    #     operation: download
    #     local_path: "${LOCAL_PATH}/Signaling_${NODE_NAME}_${DATE}.xml"  #om path
    #     remote_path: "${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml"   #repo path
    #     overwrite: true              
    #     create_dirs: true
    #   command_description: "SFTP upload backup from Repo to Local"      
        
    - node: locals
      command_description: "Finding and Comparing Checksum for Uploaded File."
      send: "sha256sum ${LOCAL_PATH}/Signaling_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
      prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$' 
      on_failure: continue
      on_failure_message: "If all retries are exhausted then execution will be stopped."
      register:
        - regex: '(?<LOCALCHECKSUM>[a-fA-F0-9]+)'
      validation:
        enabled: true
        description: "Checksum of the locals file matches the checksum of the repository backup file."
        success:
          criteria:
            expr: '${BACKUPREPOCHECKSUM == LOCALCHECKSUM}'
          message: "Backup file integrity verified. Checksums match."
          vars:
            CHECKSUM_STATUS: "SUCCESS"
        warning:
          message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
          vars:
            CHECKSUM_STATUS: "FAILED"
    - type: loop
      command_description: "Retry transfer + checksum up to ${RETRY_COUNT} times until checksum matches"
      for_each: "${LOOP_RETRY}"
      item_var: ATTEMPT
      when: '${CHECKSUM_STATUS != "SUCCESS"}'
      break_when: '${CHECKSUM_STATUS == "SUCCESS"}'
      hide_when_skipped: true
      steps:
        # - node: repo_server_sftp
        #   command_description: "Attempt ${ATTEMPT} - re-download signaling from repo to locals"
        #   sftp:
        #     operation: download
        #     local_path: "${LOCAL_PATH}/Signaling_${NODE_NAME}_${DATE}.xml"
        #     remote_path: "${BACK_UP_LOCATION_REPO}/Signaling_${NODE_NAME}_${DATE}.xml"
        #     overwrite: true
        #     create_dirs: true
        #   command_description: "SFTP upload backup from Repo to Local"  
        - node: locals
          command_description: "Attempt ${ATTEMPT} - re-verify checksum"
          send: "sha256sum ${LOCAL_PATH}/Signaling_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
          prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
          on_failure: continue
          timeout_sec: 120
          register:
            - regex: '(?<LOCALCHECKSUM>[a-fA-F0-9]+)'
          validation:
            enabled: true
            description: "Compare checksum on retry attempt ${ATTEMPT}"
            success:
              criteria:
                expr: '${BACKUPREPOCHECKSUM == LOCALCHECKSUM}'
              message: "CheckSum is same."
              vars:
                CHECKSUM_STATUS: "SUCCESS"
            warning:
              message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
              vars:
                CHECKSUM_STATUS: "FAILED"

    - node: locals
      command_description: "Abort if checksum still mismatched after ${RETRY_COUNT} retries"
      send: "echo checksum-guard"
      when: '${CHECKSUM_STATUS != "SUCCESS"}'
      hide_when_skipped: true
      on_failure: stop
      validation:
        enabled: true
        description: "Runs only when checksum did not match after all retries; always fails to abort."
        success:
          criteria:
            expr: '${CHECKSUM_STATUS == "SUCCESS"}'
          message: "checksum matched"
        failure:
          message: "Checksum did not match after all retry attempts - aborting."

    - node: niam_sbc_server
      command_description: "Take media-plane 1 Configuration backup (root)"
      send: '/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane media --user ${USER} --pemfile /root/.ssh/id_rsa --readall --mediaid 1 > /storage/MGW01_${NODE_NAME}_${DATE}.xml'
      on_failure: continue
      prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
      register:
          - regex: '(?<ERRORMSG>cannot create \[No such file or directory\])'
          - regex: '(?<ROOTNOTALLOWED>root user is not allowed)'
      validation:
        enabled: true
        description: "Media Plane 1 backup command completes successfully and XML backup file is created."
        success:
          criteria:
            expr: '${ERRORMSG == "" && ROOTNOTALLOWED == ""}'
          message: "Media Plane 1 Configuration  backup created successfully."
          vars:
            NETCONF_ROOT_OK: "true"
        warning:
          message: "root could not run netconfprov (or command failed); retrying with netconfcli user."
          vars:
            NETCONF_ROOT_OK: "false"

    - node: niam_sbc_server
      command_description: "Finding Checksum for the media-plane 1 backup file"
      send: "sha256sum /storage/MGW01_${NODE_NAME}_${DATE}.xml | awk '{print $1}'"
      prompt_regex: '(?m)^\s*[mahajan@sim ~]\s*$'
      on_failure: stop
      register:
        - regex: '(?m)^(?<MGW01NODECHECKSUM>[a-fA-F0-9]{64})$'

    - node: niam_sbc_server
      command_description: "SFTP upload media-plane 1 backup from SBC Node to Repository Server"
      send: >-
        printf "put /storage/MGW01_${NODE_NAME}_${DATE}.xml ${BACK_UP_LOCATION_REPO}/MGW01_Activity.xml\nbye\n" | sftp -o StrictHostKeyChecking=no admin@${repo_server_ip}
      on_failure: stop
      use_exit_code: true
      retries: 5
      retry_delay_sec: 15
      retry_on:
        - non_zero_exit
        - regex_miss
        - timeout
      expect_reply:
        - expect: 'password:'
          reply: 'admin'
      register:
          - regex: '(?<MGW01FILECOPY>100%)'
      validation:
        enabled: true
        description: "Media-plane 1 backup XML file is transferred successfully from SBC Node to Repository Server."
        success:
          criteria:
            expr: '${MGW01FILECOPY != ""}'
          message: "Successfully uploaded media-plane 1 backup file to the repository server."
        warning:
