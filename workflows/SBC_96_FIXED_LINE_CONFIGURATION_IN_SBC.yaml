      - node: niam_sbc_server
        command_description: "Verifies the health of the alarm subsystem."
        send: 'alarm_check --action health'
        on_failure: continue
        use_exit_code: true
        register:
          - regex: '(?<ALARMHEALTHSTATUS>Alarm health check passed)'
        validation:
         enabled: true
         description: >
            Verify output contains "Alarm health check passed".
         success:
          criteria:
            expr: '${ALARMHEALTHSTATUS != ""}'
          message: "Alarm health check passes successfully."
         warning:
          message: "Alarm Health Check Failed."

      - node: niam_sbc_server
        command_description: "Displays current alarms on the SBC node."
        send: 'alarm_cli --list all'
        on_failure: continue
        use_exit_code: true
        register:
          - regex: '(?<INFORMATIONALEXPECTE>.*)'
        validation:
          enabled: false
          description: "Informational command used to review current alarms."
          failure:
              message: "No Validation"
              
      - node: niam_sbc_server
        command_description: "Displays LCP host and service member status."
        send: 'lcp_status'
        use_exit_code: true
        on_failure: continue
        register:
         - name: INVALIDHOST
           value: ""
         - name: INVALIDSERVICE
           value: ""
         - regex: '(?ms)Host info:.*?(?<INVALIDHOST>\b(DISABLED|FAILED|LOCKED|OUTOFSERVICE|UNKNOWN)\b).*?Service Members Info'
         - regex: '(?ms)Service Members Info:.*?(?<INVALIDSERVICE>\b(DISABLED|FAILED|LOCKED|OUTOFSERVICE|UNKNOWN)\b)'
        validation:
          enabled: true
          description: >
            Verify:
              - Every Host Info Status = ENABLED
              - Service Member status values are valid (ENABLED, ENABLEDUNLOCKED, HOTSTANDBY, NOTRELEVANT).
          success:
            criteria:
               expr: '${INVALIDHOST == "" && INVALIDSERVICE == ""}'
            message: "All hosts are enabled and service members show valid operational states." 
          failure:
            message: "One or more hosts are not ENABLED, or service members show invalid/unexpected states."

      - node: niam_sbc_server
        command_description: "Displays REM service and redundancy status."
        send: 'rem_srv_state --action display --set all'
        use_exit_code: true
        on_failure: continue
        on_failure_message: "One or more services are out of service, in an invalid state, or REM controller roles are incorrect/missing. Execution will stop"
        register:
          - name: INVALIDCARDSTATE
            value: ""
          - name: INVALIDREMCSTATE
            value: ""
          - regex: '(?m)(?<INVALIDCARDSTATE>^\d+\s+\d+\s+\d+\s+\S+\s+\S+\s+\S+\s+(?!InserviceActive\b|InserviceStbyHot\b)\S+)'
          - regex: '(?<INVALIDREMCSTATE>REMc is (?!Active\b|Stby\b)\S+)'
        validation:
          enabled: true
          description: >
            Verify:
              - Status is either InserviceActive or InserviceStbyHot for all entries.
              - REM Controller (REMc) role is Active or Stby.
          success:
            criteria:
               expr: '${INVALIDCARDSTATE == "" && INVALIDREMCSTATE == ""}'
            message: "All services are in valid in-service states and REM controllers have valid redundancy roles."
          failure:
            message: "One or more services are out of service, in an invalid state, or REM controller roles are incorrect/missing."

  rollback_configuration:
    name: "ROLLBACK_CONFIGURATION"
    description: ""
    when: '${ROLLBACK_REQUIRED == "true"}'
    steps:
    
     - node: niam_sbc_server
       command_description: "Get LCP management IP address and type"
       send: |-
         lcp_status | awk '$1=="MI" && $4=="ENABLED"{n=split($6,a,","); for(i=1;i<=n;i++) if(a[i]~/^[0-9]+\./ && a[i]!~/^169\.254\./){print a[i]" (IPv4)"; found=1; exit} for(i=1;i<=n;i++) if(a[i]~/:/){print a[i]" (IPv6)"; found=1; exit}} END{exit !found}'
       use_exit_code: true
       on_failure: stop
       register:
         - regex: '(?<LCPIP>[^\s]+)\s+\((?<LCPIPTYPE>IPv4|IPv6)\)'
         - name: repo_server_ip
           when: ${LCPIPTYPE == "IPv4"}
           value: ${REPO_IP_V4}
         - name: repo_server_ip
           when: ${LCPIPTYPE == "IPv6"}
           value: "[${REPO_IP_V6}]"
          
 
     - node: niam_sbc_server
       command_description: "date"
       send: 'date +%Y-%m-%d_%H-%M-%S'
       on_failure: stop
       use_exit_code: true
       register:
         - regex: '(?<DATE>\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2})'
         
     - node: niam_sbc_server
       command_description: "Take full signaling-plane network configuration xml (root)"
       send: '/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane signaling --user ${USER} --pemfile /root/.ssh/id_rsa --readall > /storage/Signaling_${NODE_NAME}_${DATE}_Rollback.xml'
       on_failure: continue
       use_exit_code: true
       register:
         - regex: '(?<ERRORMSG>cannot create \[No such file or directory\])'
         - regex: '(?<ROOTNOTALLOWED>root user is not allowed)'
       validation:
         enabled: true
         description: "Verify signaling-plane rollback backup xml created."
         success:
           criteria:
             expr: '${ERRORMSG == "" && ROOTNOTALLOWED == ""}'
           message: "NETCONF executed successfully on ${NODE_NAME}"
           vars:
             NETCONF_ROOT_OK: "true"
         warning:
           message: "root could not run netconfprov (or command failed); retrying with netconfcli user."
           vars:
             NETCONF_ROOT_OK: "false"
             USER: 'netconfcli'

     - node: niam_sbc_server
       command_description: "Take full signaling-plane network configuration xml (netconfcli fallback)"
       when: '${NETCONF_ROOT_OK == "false"}'
       var_meta:
        NETCONF_ROOT_OK: "NETCONF command ran with root user"
       send: '/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane signaling --user netconfcli --pemfile /var/webui/.ssh/id_rsa --readall > /storage/Signaling_${NODE_NAME}_${DATE}_Rollback.xml'
       on_failure: stop
       use_exit_code: true
       register:
         - regex: '(?<ERRORMSG>cannot create \[No such file or directory\])'
       validation:
         enabled: true
         description: "Verify signaling-plane rollback backup xml created via netconfcli."
         success:
           criteria:
             expr: '${ERRORMSG == ""}'
           message: "NETCONF executed successfully via netconfcli on ${NODE_NAME}"
         failure:
           message: "NETCONF execution failed with netconfcli on ${NODE_NAME}"
          
           
     - node: niam_sbc_server
       command_description: "Finding Checksum for the backup file "
       send: "sha256sum /storage/Signaling_${NODE_NAME}_${DATE}_Rollback.xml | awk '{print $1}'"
       use_exit_code: true
