       when: '${CHECKSUM_STATUS != "SUCCESS"}'
       break_when: '${CHECKSUM_STATUS == "SUCCESS"}'
       hide_when_skipped: true
       steps:
        #  - node: repo_server_sftp
        #    command_description: "Attempt ${ATTEMPT} - re-download rollback signaling from repo to locals"
        #    sftp:
        #      operation: download
        #      local_path: "${LOCAL_PATH}/Signaling_${DATE}_Rollback.xml"
        #      remote_path: "${BACK_UP_LOCATION_REPO}/Signaling_${DATE}_Rollback.xml"
        #      overwrite: true
        #      create_dirs: true
         - node: locals
           command_description: "Attempt ${ATTEMPT} - re-verify checksum"
           send: "sha256sum ${LOCAL_PATH}/Signaling_${DATE}_Rollback.xml | awk '{print $1}'"
           on_failure: continue
           timeout_sec: 120
           register:
             - regex: '(?<LOCALCHECKSUM>[a-fA-F0-9]+)'
           validation:
             enabled: true
             description: "Compare checksum on retry attempt ${ATTEMPT}"
             success:
               criteria:
                 expr: '${REPOCHECKSUM == LOCALCHECKSUM}'
               message: "CheckSum is same."
               vars:
                 CHECKSUM_STATUS: "SUCCESS"
             warning:
               message: "Checksum mismatch detected. Retrying file transfer and checksum validation up to ${RETRY_COUNT} times."
               vars:
                 CHECKSUM_STATUS: "FAILED"
                 
     - node: locals
       command_description: "Abort if checksum still mismatched after ${RETRY_COUNT} retries"
       send: "echo checksum-guard"
       when: '${CHECKSUM_STATUS != "SUCCESS"}'
       hide_when_skipped: true
       on_failure: stop
       validation:
         enabled: true
         description: "Runs only when checksum did not match after all retries; always fails to abort."
         success:
           criteria:
             expr: '${CHECKSUM_STATUS == "SUCCESS"}'
           message: "checksum matched"
         failure:
           message: "Checksum did not match after all retry attempts - aborting."
           
     - type: loop
       for_each: "${configSequences}"
       item_var: config_seq_row
       max_iterations: 50
       reverse_order: true
       skip_when: '${EXECUTED_TABLES == "" && ROLLBACK_ONLY != "true"}'
       var_meta:
          configSequences: "List of config sequences from ciq-processor JSON for current node"
       steps:
         - type: loop
           for_each: "${config_seq_row.tables}"
           item_var: table_row
           reverse_order: true
           max_iterations: 50
           steps:

              - node: locals
                command_description: "Determine rollback scope for ${table_row.table}"
                send: "echo rollback-scope-check"
                logs: false
                hide_when_skipped: true
                register:
                   - name: TABLE_ROLLBACK_APPLICABLE
                     value: "false"
                   - name: TABLE_ROLLBACK_APPLICABLE
                     when: '${ROLLBACK_ONLY == "true" || EXECUTED_TABLES contains table_row.table}'
                     value: "true"
                   - name: CHECKSUM_STATUS
                     value: "SUCCESS"

              - node: locals
                command_description: "validate and generate network configuration xml from CIQ data according to table"
                when: '${TABLE_ROLLBACK_APPLICABLE == "true"}'
                send: >-
                 python ${ROLLBACK_PYTHON_SCRIPT_PATH}/netconf_generate_rollback_xml.py --json "${INPUT_JSON_FILE_NAME}" --node ${NODE_NAME} --xmlns "${xmlns}" --primary-keys "${primary_keys}" --base "${LOCAL_PATH}/Signaling_Activity.xml" --current "${LOCAL_PATH}/Signaling_${DATE}_Rollback.xml" --output ${LOCAL_PATH}/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Rollback.xml --table ${table_row.table} --group ${config_seq_row.configSeq}
                on_failure: continue
                register:
                  - regex: '(?<XMLGENSTATUS>SUCCESS)'
                  - regex: '(?<PARTIAL>PARTIAL ROLLBACK XML GENERATED)'
                validation:
                  enabled: true
                  description: "verify generate xml is completed successfully"
                  success:
                    criteria:
                      expr: '${XMLGENSTATUS == "SUCCESS" || PARTIAL != ""}'
                    message: "verify generate xml is successfully ${PARTIAL}"
                    vars:
                      ROLLBACK_EXECUTED_TABLES: "${ROLLBACK_EXECUTED_TABLES}${table_row.table}, "
                  warning:
                    message: "verify generate xml is not successfully"

         - type: loop
           for_each: "${config_seq_row.tables}"
           item_var: table_row
           reverse_order: true
           max_iterations: 50
           steps:

              - node: locals
                command_description: "Determine rollback scope for ${table_row.table}"
                send: "echo rollback-scope-check"
                logs: false
                hide_when_skipped: true
                register:
                   - name: TABLE_ROLLBACK_APPLICABLE
                     value: "false"
                   - name: TABLE_ROLLBACK_APPLICABLE
                     when: '${ROLLBACK_ONLY == "true" || ROLLBACK_EXECUTED_TABLES contains table_row.table}'
                     value: "true"
                   - name: CHECKSUM_STATUS
                     value: "SUCCESS"
                     
                     
              - node: niam_sbc_server
                command_description: "Take full table configuration xml for ${table_row.table} before rollback execution"
                send: '/opt/sbc/CurrRel/scripts/netconfprov/netconfprov --plane signaling --user ${USER} --pemfile /root/.ssh/id_rsa --table ${table_row.table} --read > /storage/${table_row.table}_${config_seq_row.configSeq}_${DATE}_Rollback_Precheck.xml'
                on_failure: stop
                use_exit_code: true
                register:
                  - regex: '(?<ERRORMSG>cannot create \[No such file or directory\])'
